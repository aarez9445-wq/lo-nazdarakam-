<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>بارانی خۆشەویستی</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#3b1466,#14052b 70%)}
canvas#bg{position:fixed;inset:0;z-index:0}
canvas#fx{position:fixed;inset:0;z-index:9;pointer-events:none}
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.screen.active{display:flex;animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.card{width:min(92vw,430px);padding:26px 22px;border-radius:26px;background:rgba(30,10,60,.72);border:2px solid #ff4d9d;box-shadow:0 0 30px #ff4d9d88,inset 0 0 20px #ffd70022;backdrop-filter:blur(8px)}
.badge{display:inline-block;font-size:13px;padding:6px 14px;border-radius:30px;background:#ffffff18;border:1px solid #ffd70088;color:#ffe08a;margin-bottom:16px}
h1{font-size:34px;margin:8px 0 12px;color:#ff7ab8;text-shadow:0 0 18px #ff4d9d}
h2{font-size:22px;margin:10px 0 12px;color:#ffd36b}
p{line-height:2;font-size:15.5px;color:#f3e6ff}
.sign{margin-top:14px;font-size:14px;color:#ffb3d6}
.bigheart{font-size:70px;animation:beat 1.2s infinite;filter:drop-shadow(0 0 18px #ff2d7a)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.hint{margin:14px 0;font-size:13.5px;color:#ffd0e8}
button{font-family:inherit;cursor:pointer;border:0;border-radius:40px;padding:13px 26px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff4d9d,#ff8a5c);box-shadow:0 6px 20px #ff4d9d66;transition:.2s}
button:active{transform:scale(.95)}
button.alt{background:#ffffff1c;box-shadow:none;border:1px solid #ffffff44}
.row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
#game{padding:0}
#gc{position:absolute;inset:0}
.progress{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(88vw,380px);z-index:4}
.bar{height:14px;border-radius:20px;background:#ffffff22;overflow:hidden;border:1px solid #ffffff33}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4d9d,#ffb36b);transition:width .35s;box-shadow:0 0 12px #ff4d9d}
.progress span{display:block;margin-top:8px;font-size:14px;color:#ffd0e8}
.float{position:absolute;z-index:5;font-size:20px;font-weight:700;color:#ffe08a;text-shadow:0 0 10px #ff4d9d;animation:up 1.6s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110px);opacity:0}}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots b{width:9px;height:9px;border-radius:50%;background:#ffffff33}
.dots b.on{background:#ff4d9d;box-shadow:0 0 8px #ff4d9d}
/* VIP */
.vip{border:2px solid #ffd36b;background:linear-gradient(160deg,rgba(60,35,5,.85),rgba(30,10,60,.9));box-shadow:0 0 40px #ffd36baa,inset 0 0 30px #ffd36b22;position:relative;overflow:hidden}
.vip::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);animation:shine 3.2s infinite}
@keyframes shine{to{left:160%}}
.crown{font-size:58px;animation:beat 1.6s infinite;filter:drop-shadow(0 0 16px gold)}
.vipt{font-size:30px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#fff2b0,#ffc83d,#fff2b0);-webkit-background-clip:text;color:transparent}
input{width:100%;margin-top:12px;padding:12px 16px;border-radius:14px;border:1px solid #ffd36b88;background:#00000044;color:#fff;font-family:inherit;font-size:16px;text-align:center;outline:0}
.code{margin-top:16px;padding:12px;border:2px dashed #ffd36b;border-radius:14px;font-size:20px;letter-spacing:3px;color:#ffd36b;direction:ltr}
#vipText{min-height:150px;margin-top:12px}
#mute{position:fixed;top:12px;left:12px;z-index:20;padding:8px 12px;font-size:16px;background:#ffffff22;box-shadow:none}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<button id="mute">🔊</button>
<!-- لێرە گۆرانییەکەی خۆت دابنێ: فایلەکە بەناوی song.mp3 لە تەنیشت index.html دابنێ -->
<audio id="song" loop src="song.mp3"></audio>

<section class="screen active" id="intro">
  <div class="card">
    <div class="badge">✨ تایبەتترین بۆ ئازیزترین کەسەم ✨</div>
    <div class="bigheart">💖</div>
    <h1>بارانی خۆشەویستی</h1>
    <p>بەخێربێیت بۆ جیهانی عەشقەکەمان! تکایە ١٠ دڵی ڕۆمانسی کۆبکەرەوە بۆ ئەوەی قوفڵی سێ نامە نهێنیەکەی دڵم بکەیتەوە کە تەنها بۆ تۆ نووسراون.</p>
    <p class="hint">👉 بە پەنجەت لەسەر شاشەکە سەبەتەی دڵەکان بجوڵێنە</p>
    <button id="startBtn">دەستپێکردنی یاری 💖</button>
  </div>
</section>

<section class="screen" id="game">
  <canvas id="gc"></canvas>
  <div class="progress"><div class="bar"><i id="fill"></i></div><span id="count">دڵەکان: 0 / 10</span></div>
</section>

<section class="screen" id="cards">
  <div class="card" id="cardBox"></div>
  <div class="dots" id="dots"></div>
</section>

<script>
const $=s=>document.querySelector(s);
const bg=$('#bg'),bx=bg.getContext('2d'),fx=$('#fx'),fc=fx.getContext('2d'),gc=$('#gc'),g=gc.getContext('2d');
let W,H,stars=[];
function resize(){
  W=bg.width=fx.width=gc.width=innerWidth;H=bg.height=fx.height=gc.height=innerHeight;
  stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,t:Math.random()*6,v:Math.random()*.25+.05}));
}
addEventListener('resize',resize);resize();

/* ---------- Background + confetti ---------- */
let parts=[];
function burst(x,y,n=40,vip=false){
  const em=vip?['💛','✨','👑','💖','⭐']:['💖','💗','✨','💕','🧡'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*7+2;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,e:em[i%em.length],sz:Math.random()*14+14,life:100+Math.random()*60});}
}
function loop(t){
  bx.clearRect(0,0,W,H);
  stars.forEach(s=>{s.y+=s.v;if(s.y>H)s.y=0;bx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.t));bx.fillStyle='#fff';bx.beginPath();bx.arc(s.x,s.y,s.r,0,7);bx.fill();});
  bx.globalAlpha=1;
  fc.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;fc.globalAlpha=Math.min(1,p.life/40);fc.font=p.sz+'px serif';fc.fillText(p.e,p.x,p.y);});
  fc.globalAlpha=1;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');}

/* ---------- Music ---------- */
const song=$('#song');let muted=false;
$('#mute').onclick=()=>{muted=!muted;song.muted=muted;$('#mute').textContent=muted?'🔇':'🔊';};

/* ---------- Game ---------- */
const words=['هەناسم ✨','گیانەکەم 💖','تاقانەکەم 💖','دڵەکەم 💖'];
let hearts=[],caught=0,running=false,basketX=0,lastSpawn=0;
const GOAL=10;
function startGame(){
  caught=0;hearts=[];running=true;basketX=W/2;updateBar();show('game');
  song.play().catch(()=>{});lastSpawn=performance.now();requestAnimationFrame(gameLoop);
}
function updateBar(){$('#fill').style.width=(caught/GOAL*100)+'%';$('#count').textContent='دڵەکان: '+caught+' / '+GOAL;}
function gameLoop(t){
  if(!running)return;
  g.clearRect(0,0,W,H);
  if(t-lastSpawn>650){hearts.push({x:Math.random()*(W-60)+30,y:-30,v:2.2+Math.random()*2.2,e:['❤️','💖','🧡','💗'][Math.floor(Math.random()*4)],s:Math.random()*14+28});lastSpawn=t;}
  const by=H-110;
  hearts=hearts.filter(h=>{
    h.y+=h.v;g.font=h.s+'px serif';g.textAlign='center';g.fillText(h.e,h.x,h.y);
    if(h.y>by-20&&h.y<by+30&&Math.abs(h.x-basketX)<55){
      caught++;updateBar();burst(h.x,h.y,10);
      const f=document.createElement('div');f.className='float';f.textContent=words[caught%4];f.style.left=(h.x-40)+'px';f.style.top=(by-30)+'px';$('#game').appendChild(f);setTimeout(()=>f.remove(),1600);
      if(caught>=GOAL){running=false;setTimeout(()=>{burst(W/2,H/2,80);openCards(0);},500);}
      return false;
    }
    return h.y<H+40;
  });
  g.font='64px serif';g.fillText('🧺',basketX,by+30);
  g.font='26px serif';g.fillText('💖',basketX,by+22);
  requestAnimationFrame(gameLoop);
}
function move(e){const p=e.touches?e.touches[0]:e;basketX=Math.max(40,Math.min(W-40,p.clientX));}
gc.addEventListener('pointermove',move);gc.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
gc.addEventListener('pointerdown',move);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')basketX-=30;if(e.key==='ArrowRight')basketX+=30;});

/* ---------- Cards ---------- */
const cards=[
 {i:'🧡',t:'ترپەی دڵم و ڕووناکی چاوم',p:'لەو ساتەی هاتوویەتە ناو ژیانمەوە، هەموو چرکەیەکی پڕ بووە لە خۆشەویستی و جوانی. تۆ تەنها خۆشەویستی من نیت، بەڵکو شیرینترین خەونی منیت کە لە ڕاستیدا هاتووەتە دی.',s:'✍️ لە قوڵایی دڵمەوە بۆ تۆی ئازیز'},
 {i:'✨',t:'جوانترین دیاری قەدەر',p:'ئەگەر هەموو ئەستێرەکانی ئاسمان بکەم بە دیاری بۆ تۆ، هێشتا ناگات بە جوانی یەک زەردەخەنەی سەر لێوانت. بوونی تۆ لە ژیانمدا گەورەترین نیعمەت و ئارامییە بۆ ڕۆحم.',s:'✍️ شازادەی خەون و خەیاڵەکانم'},
 {i:'∞',t:'بەڵێنی هەتاهەتایی',p:'بەڵێن بێت تا کۆتا هەناسەی ژیانم، دڵم تەنها بۆ تۆ لێبدات و لە هەموو ساتێکدا پشت و پەنات بم. خۆشم دەوێیت زیاتر لەوەی وشەکان بتوانن وەسفی بکەن، ئەی هەموو کەسم!',s:'✍️ خۆشم دەوێیت تا هەتایە و بۆ هەمیشە'}
];
let idx=0;
function openCards(i){show('cards');renderCard(i);}
function renderCard(i){
  idx=i;const c=cards[i];
  $('#cardBox').className='card';
  $('#cardBox').innerHTML=`<div style="font-size:46px">${c.i}</div><h2>${c.t}</h2><p>${c.p}</p><div class="sign">${c.s}</div>
  <div class="row">${i>0?'<button class="alt" id="prev">← پێشتر</button>':''}${i<2?'<button id="next">دواتر ←</button>':''}
  ${i==2?'<button id="party">ئاهەنگی عەشق 🎶</button><button class="alt" id="again">🔄 دووبارە یاری بکەرەوە</button>':''}</div>`;
  $('#dots').innerHTML=[0,1,2,3].map(k=>`<b class="${k==i?'on':''}"></b>`).join('');
  const q=id=>$('#'+id);
  if(q('prev'))q('prev').onclick=()=>renderCard(i-1);
  if(q('next'))q('next').onclick=()=>renderCard(i+1);
  if(q('again'))q('again').onclick=startGame;
  if(q('party'))q('party').onclick=()=>{
    burst(W/2,H/2,120);setTimeout(()=>burst(W*.2,H*.4,60),300);setTimeout(()=>burst(W*.8,H*.4,60),600);
    setTimeout(renderVIP,1400);
  };
}

/* ---------- Step 4: VIP ---------- */
function renderVIP(){
  idx=3;$('#dots').innerHTML=[0,1,2,3].map(k=>`<b class="${k==3?'on':''}"></b>`).join('');
  const b=$('#cardBox');b.className='card vip';
  b.innerHTML=`<div class="crown">👑</div><div class="vipt">VIP</div>
  <h2>نامەی تایبەتی VIP</h2>
  <p>ئەم نامەیە تەنها بۆ کەسانی زۆر تایبەتە. ناوی خۆشەویستەکەت بنووسە:</p>
  <input id="nm" placeholder="ناو..." maxlength="24">
  <div class="row"><button id="unlock">کردنەوەی نامەی VIP 👑</button></div>
  <p id="vipText"></p><div class="code" id="code" style="display:none">VIP-LOVE-∞-2026</div>
  <div class="row"><button class="alt" id="back">← گەڕانەوە</button><button class="alt" id="replay">🔄 دووبارە</button></div>`;
  $('#back').onclick=()=>renderCard(2);$('#replay').onclick=startGame;
  $('#unlock').onclick=()=>{
    const n=$('#nm').value.trim()||'ئازیزەکەم';
    const txt=`${n} ی ئازیز، 👑\nتۆ بۆ من تەنها کەسێک نیت، بەڵکو شاژن و جیهانی منیت. هەموو ئەو دڵانەی کۆت کردنەوە هێمای یەک شتن: تۆ هەمیشە لە یەکەمین شوێنی دڵمدایت. ئەم کلیلە زێڕینە هی تۆیە بۆ هەمیشە.`;
    const el=$('#vipText');el.style.whiteSpace='pre-line';el.textContent='';let k=0;
    burst(W/2,H/3,90,true);
    const iv=setInterval(()=>{el.textContent+=txt[k++];if(k%40==0)burst(Math.random()*W,Math.random()*H*.5,25,true);
      if(k>=txt.length){clearInterval(iv);$('#code').style.display='block';burst(W/2,H/2,140,true);}},45);
  };
}

$('#startBtn').onclick=startGame;
</script>
</body>
</html>
